name: Legal Inventory

on:
  push:
    branches: ["main"]
    paths:
      - "assets/plant_images/gbif_samples/index.json"
      - "tools/legacy/publish_image_license_inventory.py"
      - ".github/workflows/legal-inventory.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to Firebase"
        required: false
        default: true
        type: boolean
      fail_on_missing_license:
        description: "Fail on missing license (required source types only)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  legal_inventory:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIRESTORE_DATABASE_ID: ${{ secrets.FIRESTORE_DATABASE_ID }}
      LEGAL_INVENTORY_COLLECTION: ${{ secrets.LEGAL_INVENTORY_COLLECTION }}
      LEGAL_INVENTORY_LATEST_DOC_ID: ${{ secrets.LEGAL_INVENTORY_LATEST_DOC_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt firebase-admin

      - name: Build inventory
        run: |
          python tools/legacy/publish_image_license_inventory.py

      - name: Optional quality gate
        if: ${{ github.event_name == 'push' || inputs.fail_on_missing_license }}
        run: |
          python tools/legacy/publish_image_license_inventory.py --fail-on-missing-license

      - name: Upload inventory artifacts
        uses: actions/upload-artifact@v4
        with:
          name: legal-inventory-${{ github.run_number }}
          retention-days: 1
          path: |
            data/legal/image_license_inventory.csv
            data/legal/image_license_inventory.json
            data/legal/image_license_todo.json

      - name: Publish to Firebase
        if: >-
          ${{
            (github.event_name == 'push' || inputs.publish) &&
            env.FIREBASE_PROJECT_ID != '' &&
            env.FIREBASE_SERVICE_ACCOUNT_JSON != ''
          }}
        run: |
          python tools/legacy/publish_image_license_inventory.py --publish

      - name: Publish skipped notice
        if: >-
          ${{
            (github.event_name == 'push' || inputs.publish) &&
            (env.FIREBASE_PROJECT_ID == '' ||
             env.FIREBASE_SERVICE_ACCOUNT_JSON == '')
          }}
        run: |
          echo "Skipping Firebase publish because required secrets are missing."
          echo "Set FIREBASE_PROJECT_ID and FIREBASE_SERVICE_ACCOUNT_JSON."
          echo "Optional for non-default Firestore DB: FIRESTORE_DATABASE_ID."
