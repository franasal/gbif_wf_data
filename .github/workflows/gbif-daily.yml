name: Daily GBIF update

on:
  schedule:
    - cron: "0 3 * * *"  # daily, 04:00 CET (03:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build_db:
    name: Build / update SQLite DB
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore GBIF download cache
        uses: actions/cache@v4
        with:
          path: .tmp_gbif
          key: gbif-zip-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            gbif-zip-${{ runner.os }}-

      - name: Restore SQLite cache
        uses: actions/cache@v4
        with:
          path: data/dwca.sqlite
          key: dwca-sqlite-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dwca-sqlite-${{ runner.os }}-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DB-only pipeline (GBIF download + load SQLite)
        env:
          GBIF_DOWNLOAD_KEY: ${{ secrets.GBIF_DOWNLOAD_KEY }}
          GBIF_USER: ${{ secrets.GBIF_USER }}
          GBIF_PWD: ${{ secrets.GBIF_PWD }}
          GBIF_EMAIL: ${{ secrets.GBIF_EMAIL }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u tools/run_daily_update.py --db-only

      - name: Upload DB checkpoint artifact
        uses: actions/upload-artifact@v4
        with:
          name: dwca-sqlite
          path: data/dwca.sqlite
          retention-days: 7

      - name: Upload generated state files artifact
        uses: actions/upload-artifact@v4
        with:
          name: gbif-state-files
          retention-days: 7
          if-no-files-found: ignore
          path: |
            data/gbif_state.json
            data/names_edible.json
            data/names_poisonous.json
            data/names_prod.json
            data/names_de.json
            data/plants_resolved.json
            data/plants_resolved_edible.json
            data/plants_resolved_poisonous.json
            data/taxon_cache.json
            data/updates_summary.json
            data/updates_summary_edible.json
            data/updates_summary_poisonous.json


  export_and_release:
    name: Export compact dataset + publish Release asset
    needs: build_db
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download DB checkpoint artifact
        uses: actions/download-artifact@v4
        with:
          name: dwca-sqlite
          path: data

      - name: Download generated state files artifact
        uses: actions/download-artifact@v4
        with:
          name: gbif-state-files
          path: .

      - name: Run export-only pipeline (creates occurrences_compact.json.gz)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u tools/run_daily_update.py --export-only

      - name: Export approved observations overlay from Firestore (if queued)
        env:
          FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON }}
          FIRESTORE_DATABASE_ID: wild--forager-db
        run: |
          set -euxo pipefail
          if [ -z "${FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON not set; skipping Firestore overlay export."
            exit 0
          fi
          python - <<'PY'
import os
from pathlib import Path
out = Path("data/firebase_admin_service_account.json")
out.parent.mkdir(parents=True, exist_ok=True)
out.write_text(os.environ["FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON"], encoding="utf-8")
print(f"Wrote {out}")
PY
          python -u tools/export_approved_observations_from_firestore.py \
            --service-account data/firebase_admin_service_account.json \
            --database-id "${FIRESTORE_DATABASE_ID}" \
            --out data/approved_observations.json.gz \
            --require-trigger \
            --mark-trigger-processed
          rm -f data/firebase_admin_service_account.json

      - name: Generate approved observations overlay placeholder (if missing)
        run: |
          python -u tools/generate_approved_observations_placeholder.py \
            --out data/approved_observations.json.gz

      - name: Commit outputs (if changed) and push
        run: |
          set -euxo pipefail

          git config user.name "gbif-bot"
          git config user.email "gbif-bot@users.noreply.github.com"

          # Stage modifications/deletions for tracked generated files under data/.
          git add -u data

          # Keep local-only/generated artifacts out of git commits.
          git restore --staged --worktree data/dwca.sqlite || true
          rm -f data/changes_summary.json || true

          # Stage generated outputs that may be newly created in a fresh checkout.
          for file in \
            data/gbif_state.json \
            data/names_edible.json \
            data/names_poisonous.json \
            data/names_prod.json \
            data/names_de.json \
            data/plants_resolved.json \
            data/plants_resolved_edible.json \
            data/plants_resolved_poisonous.json \
            data/taxon_cache.json \
            data/occurrences_compact.json.gz \
            data/occurrences_compact_edible.json.gz \
            data/occurrences_compact_poisonous.json.gz \
            data/occurrences_recent.json.gz \
            data/occurrences_recent_edible.json.gz \
            data/occurrences_recent_poisonous.json.gz \
            data/approved_observations.json.gz \
            data/updates_summary.json \
            data/updates_summary_edible.json \
            data/updates_summary_poisonous.json; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          git status --short

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "chore(state): daily GBIF refresh"

          # Sync with remote to avoid "fetch first"
          git restore --worktree data/dwca.sqlite || true
          rm -f data/changes_summary.json || true
          git status --short
          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main

      - name: Publish / update Release asset (latest)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -u tools/publish_release_asset.py \
            --tag latest \
            --title "Latest GBIF export" \
            --notes "Auto-generated data export. Assets: compact legacy + split datasets + light packs." \
            --dataset data/occurrences_compact.json.gz \
            --dataset-edible data/occurrences_compact_edible.json.gz \
            --dataset-poisonous data/occurrences_compact_poisonous.json.gz \
            --recent-dataset data/occurrences_recent.json.gz \
            --recent-dataset-edible data/occurrences_recent_edible.json.gz \
            --recent-dataset-poisonous data/occurrences_recent_poisonous.json.gz \
            --approved-observations data/approved_observations.json.gz \
            --light-pack-edible assets/plant_images/light_build/edible/gbif_light_edible.zip \
            --light-pack-poisonous assets/plant_images/light_build/poisonous/gbif_light_poisonous.zip

      - name: Publish / update Release asset (latest-dev)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -u tools/publish_release_asset.py \
            --tag latest-dev \
            --title "Latest GBIF export (dev split)" \
            --notes "Auto-generated data export (split + light packs)." \
            --dataset-edible data/occurrences_compact_edible.json.gz \
            --dataset-poisonous data/occurrences_compact_poisonous.json.gz \
            --recent-dataset-edible data/occurrences_recent_edible.json.gz \
            --recent-dataset-poisonous data/occurrences_recent_poisonous.json.gz \
            --approved-observations data/approved_observations.json.gz \
            --light-pack-edible assets/plant_images/light_build/edible/gbif_light_edible.zip \
            --light-pack-poisonous assets/plant_images/light_build/poisonous/gbif_light_poisonous.zip
