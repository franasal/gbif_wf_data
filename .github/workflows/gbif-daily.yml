name: Daily GBIF update

on:
  schedule:
    - cron: "0 3 * * *"  # daily, 04:00 CET (03:00 UTC)
  workflow_dispatch:
    inputs:
      force_weekly:
        description: "Force a full rolling-window refresh (like weekly) instead of the small daily window."
        required: false
        default: false
        type: boolean
      download_key:
        description: "Optional: reuse an existing GBIF download key (snapshot). Leave empty to request a fresh download."
        required: false
        default: ""
        type: string
      commit_outputs:
        description: "Commit generated state files back to the repo (keeps large datasets out of git)."
        required: false
        default: false
        type: boolean
      release_suffix:
        description: "Optional release tag suffix, e.g. '-canary' => latest-canary / latest-dev-canary."
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build_db:
    name: Build / update SQLite DB
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore GBIF download cache
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.force_weekly) }}
        uses: actions/cache@v4
        with:
          path: .tmp_gbif
          key: gbif-zip-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            gbif-zip-${{ runner.os }}-

      - name: Restore GBIF download cache (no restore-keys; force weekly)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_weekly }}
        uses: actions/cache@v4
        with:
          path: .tmp_gbif
          key: gbif-zip-${{ runner.os }}-${{ github.run_id }}

      - name: Restore SQLite cache
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.force_weekly) }}
        uses: actions/cache@v4
        with:
          path: data/dwca.sqlite
          key: dwca-sqlite-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dwca-sqlite-${{ runner.os }}-

      - name: Restore SQLite cache (no restore-keys; force weekly)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_weekly }}
        uses: actions/cache@v4
        with:
          path: data/dwca.sqlite
          key: dwca-sqlite-${{ runner.os }}-${{ github.run_id }}

      - name: Force Weekly - clear cached artifacts (fresh download + rebuild)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_weekly }}
        run: |
          set -euxo pipefail
          rm -rf .tmp_gbif
          rm -f data/dwca.sqlite data/dwca.sqlite-wal data/dwca.sqlite-shm

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DB-only pipeline (GBIF download + load SQLite)
        env:
          GBIF_USER: ${{ secrets.GBIF_USER }}
          GBIF_PWD: ${{ secrets.GBIF_PWD }}
          GBIF_EMAIL: ${{ secrets.GBIF_EMAIL }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euxo pipefail
          args=(--db-only)
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.download_key != '' }}" = "true" ]; then
            args+=(--download-key "${{ inputs.download_key }}")
          fi
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.force_weekly }}" = "true" ]; then
            args+=(--force-weekly)
          fi
          python -u tools/run_daily_update.py "${args[@]}"

      - name: Upload DB checkpoint artifact
        uses: actions/upload-artifact@v4
        with:
          name: dwca-sqlite
          path: data/dwca.sqlite
          retention-days: 7

      - name: Upload generated state files artifact
        uses: actions/upload-artifact@v4
        with:
          name: gbif-state-files
          retention-days: 7
          if-no-files-found: ignore
          path: |
            data/gbif_state.json
            data/names_edible.json
            data/names_poisonous.json
            data/names_prod.json
            data/names_de.json
            data/plants_resolved.json
            data/plants_resolved_edible.json
            data/plants_resolved_poisonous.json
            data/taxon_cache.json
            data/updates_summary.json
            data/updates_summary_edible.json
            data/updates_summary_poisonous.json


  export_and_release:
    name: Export compact dataset + publish Release asset
    needs: build_db
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download DB checkpoint artifact
        uses: actions/download-artifact@v4
        with:
          name: dwca-sqlite
          path: data

      - name: Download generated state files artifact
        uses: actions/download-artifact@v4
        with:
          name: gbif-state-files
          path: .

      - name: Run export-only pipeline (creates occurrences_compact.json.gz)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u tools/run_daily_update.py --export-only

      - name: Export approved observations overlay from Firestore (if queued)
        env:
          FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON }}
          FIRESTORE_DATABASE_ID: wild--forager-db
        run: |
          set -euxo pipefail
          if [ -z "${FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON not set; skipping Firestore overlay export."
            exit 0
          fi
          python - <<'PY'
          import os
          from pathlib import Path
          out = Path("data/firebase_admin_service_account.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(os.environ["FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON"], encoding="utf-8")
          print(f"Wrote {out}")
          PY
          python -u tools/export_approved_observations_from_firestore.py \
            --service-account data/firebase_admin_service_account.json \
            --database-id "${FIRESTORE_DATABASE_ID}" \
            --out data/approved_observations.json.gz \
            --require-trigger \
            --mark-trigger-processed
          rm -f data/firebase_admin_service_account.json

      - name: Generate approved observations overlay placeholder (if missing)
        run: |
          python -u tools/generate_approved_observations_placeholder.py \
            --out data/approved_observations.json.gz

      - name: Build protected areas asset
        run: |
          python -u tools/fetch_protected_areas.py \
            --tmp-dir tmp/protected_areas_raw \
            --output data/protected_areas_de.json.gz

      - name: Commit outputs (if changed) and push
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_outputs }}
        run: |
          set -euxo pipefail

          git config user.name "gbif-bot"
          git config user.email "gbif-bot@users.noreply.github.com"

          # Keep large datasets / local artifacts out of git; publish them via Releases instead.
          # Stage smaller state/config outputs that may be newly created in a fresh checkout.
          for file in \
            data/gbif_state.json \
            data/names_edible.json \
            data/names_poisonous.json \
            data/names_prod.json \
            data/names_de.json \
            data/plants_resolved.json \
            data/plants_resolved_edible.json \
            data/plants_resolved_poisonous.json \
            data/taxon_cache.json \
            data/updates_summary.json \
            data/updates_summary_edible.json \
            data/updates_summary_poisonous.json; do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          git status --short

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "chore(state): daily GBIF refresh"

          # Sync with remote to avoid "fetch first"
          git status --short
          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main

      - name: Publish / update Release asset (latest)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SUFFIX: ${{ github.event_name == 'workflow_dispatch' && inputs.release_suffix || '' }}
        run: |
          set -euxo pipefail
          TAG_LATEST="latest${RELEASE_SUFFIX}"
          TITLE_LATEST="Latest GBIF export"
          if [ -n "${RELEASE_SUFFIX}" ]; then
            TITLE_LATEST="${TITLE_LATEST} ${RELEASE_SUFFIX}"
          fi
          python -u tools/publish_release_asset.py \
            --tag "${TAG_LATEST}" \
            --title "${TITLE_LATEST}" \
            --notes "Auto-generated data export. Assets: compact legacy + split datasets + light packs." \
            --dataset data/occurrences_compact.json.gz \
            --dataset-edible data/occurrences_compact_edible.json.gz \
            --dataset-poisonous data/occurrences_compact_poisonous.json.gz \
            --recent-dataset data/occurrences_recent.json.gz \
            --recent-dataset-edible data/occurrences_recent_edible.json.gz \
            --recent-dataset-poisonous data/occurrences_recent_poisonous.json.gz \
            --approved-observations data/approved_observations.json.gz \
            --protected-areas data/protected_areas_de.json.gz \
            --light-pack-edible assets/plant_images/light_build/edible/gbif_light_edible.zip \
            --light-pack-poisonous assets/plant_images/light_build/poisonous/gbif_light_poisonous.zip

      - name: Publish / update Release asset (latest-dev)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SUFFIX: ${{ github.event_name == 'workflow_dispatch' && inputs.release_suffix || '' }}
        run: |
          set -euxo pipefail
          TAG_DEV="latest-dev${RELEASE_SUFFIX}"
          TITLE_DEV="Latest GBIF export (dev split)"
          if [ -n "${RELEASE_SUFFIX}" ]; then
            TITLE_DEV="${TITLE_DEV} ${RELEASE_SUFFIX}"
          fi
          python -u tools/publish_release_asset.py \
            --tag "${TAG_DEV}" \
            --title "${TITLE_DEV}" \
            --notes "Auto-generated data export (split + light packs)." \
            --dataset-edible data/occurrences_compact_edible.json.gz \
            --dataset-poisonous data/occurrences_compact_poisonous.json.gz \
            --recent-dataset-edible data/occurrences_recent_edible.json.gz \
            --recent-dataset-poisonous data/occurrences_recent_poisonous.json.gz \
            --approved-observations data/approved_observations.json.gz \
            --protected-areas data/protected_areas_de.json.gz \
            --light-pack-edible assets/plant_images/light_build/edible/gbif_light_edible.zip \
            --light-pack-poisonous assets/plant_images/light_build/poisonous/gbif_light_poisonous.zip
