name: Daily GBIF update

on:
  schedule:
    - cron: "0 3 * * *"  # daily, 04:00 CET (03:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build_db:
    name: Build / update SQLite DB
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore GBIF download cache
        uses: actions/cache@v4
        with:
          path: .tmp_gbif
          key: gbif-zip-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            gbif-zip-${{ runner.os }}-

      - name: Restore SQLite cache
        uses: actions/cache@v4
        with:
          path: data/dwca.sqlite
          key: dwca-sqlite-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dwca-sqlite-${{ runner.os }}-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DB-only pipeline (GBIF download + load SQLite)
        env:
          GBIF_DOWNLOAD_KEY: ${{ secrets.GBIF_DOWNLOAD_KEY }}
          GBIF_USER: ${{ secrets.GBIF_USER }}
          GBIF_PWD: ${{ secrets.GBIF_PWD }}
          GBIF_EMAIL: ${{ secrets.GBIF_EMAIL }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u tools/run_daily_update.py --db-only

      - name: Upload DB checkpoint artifact
        uses: actions/upload-artifact@v4
        with:
          name: dwca-sqlite
          path: data/dwca.sqlite
          retention-days: 7

      - name: Commit outputs (if changed) and push
        run: |
          set -euxo pipefail
      
          git config user.name "gbif-bot"
          git config user.email "gbif-bot@users.noreply.github.com"
      
          for file in \
            data/gbif_state.json \
            data/names_edible.json \
            data/names_poisonous.json \
            data/names_prod.json \
            data/names_de.json \
            data/plants_resolved.json \
            data/plants_resolved_edible.json \
            data/plants_resolved_poisonous.json \
            data/taxon_cache.json \
            data/occurrences_compact.json.gz \
            data/occurrences_compact_edible.json.gz \
            data/occurrences_compact_poisonous.json.gz \
            data/updates_summary.json; do
            if [ -f "data/updates_summary_edible.json" ]; then
              git add data/updates_summary_edible.json
            fi
            if [ -f "data/updates_summary_poisonous.json" ]; then
              git add data/updates_summary_poisonous.json
            fi
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done
      
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
      
          git commit -m "chore(state): daily GBIF refresh"
      
          # Sync with remote to avoid "fetch first"
          git fetch origin main
          git rebase origin/main
      
          git push origin HEAD:main


  export_and_release:
    name: Export compact dataset + publish Release asset
    needs: build_db
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download DB checkpoint artifact
        uses: actions/download-artifact@v4
        with:
          name: dwca-sqlite
          path: data

      - name: Run export-only pipeline (creates occurrences_compact.json.gz)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u tools/run_daily_update.py --export-only

      - name: Publish / update Release asset (latest)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -u tools/publish_release_asset.py \
            --tag latest \
            --title "Latest GBIF export" \
            --notes "Auto-generated data export. Assets: occurrences_compact.json.gz + split datasets." \
            --dataset data/occurrences_compact.json.gz \
            --dataset-edible data/occurrences_compact_edible.json.gz \
            --dataset-poisonous data/occurrences_compact_poisonous.json.gz

      - name: Publish / update Release asset (latest-dev)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -u tools/publish_release_asset.py \
            --tag latest-dev \
            --title "Latest GBIF export (dev split)" \
            --notes "Auto-generated data export (split). Assets: occurrences_compact_edible.json.gz + occurrences_compact_poisonous.json.gz." \
            --dataset-edible data/occurrences_compact_edible.json.gz \
            --dataset-poisonous data/occurrences_compact_poisonous.json.gz
